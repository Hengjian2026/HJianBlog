# PaperMod

baseURL: 'https://hjian.online/'
title: HJianBlog
theme: PaperMod

pagination:
  pagerSize: 20
languageCode: zh-cn
defaultContentLanguage: zh
defaultContentLanguageInSubdir: false

enableEmoji: true
enableRobotsTXT: true

buildDrafts: false
buildFuture: false
buildExpired: false
buildExpiredAfter: 0

googleAnalytics:

minify:
  disableXML: true
  minifyOutput: true

menu:
  main:
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 10
    - identifier: about
      name: 关于
      url: /about/
      weight: 20

params:
  env: production
  title: "恒健知行 - 个人博客"
  description: "医院管理运营 · 数据驱动 · 实践分享"
  keywords: [医院运营, DRG, DIP, 数据分析, 医疗信息化, 医院评审]
  author: 恒健知行
  images: [images/placeholder.png]
  ShowFullText: false
  DateFormat: 2006-01
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowPostDate: true
  ShowWordCount: true
  ShowToc: true
  ShowLastMod: true
  TocOpen: false
  ShowBreadcrumb: false
  ShowCodeCopyButton: true
  ShowAllPagesFromEndpoint: false
  homeInfoParams:
    Title: "恒健知行 - 个人博客"
    Content: "医院管理运营 · 数据驱动 · 实践分享\n\n本站内容同步自微信公众号「恒健知行」。"
  socials:
    - name: github
      url: "https://github.com/Hengjian2026"
    - name: rss
      url: "/index.xml"
  fawas: true
  profileMode:
    enabled: false
  assets:
    disableHLJS: false
    favicon: "favicon.ico"
    favicon16x16: "favicon-16x16.png"
    favicon32x32: "favicon-32x32.png"
    apple_touch_icon: "apple-touch-icon.png"
    safari_pinned_tab: "safari-pinned-tab.svg"
  labels:
    archive sidebar:
    search sidebar:
  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false
  share:
  analytics:
    googleTagManager:
    googleSiteVerificationTag:
    naverVerificationTag:
    bingVerificationTag:
    yandexVerificationTag:
    fathomAnalytics:
    clarity:
    goatCounter:
    buiAnalytics:
  comments: false
  search:
    enabled: false
    settings:
      datasource:
      maxResultLength: 10
      minLengthOfQuery: 2
      snippetLength: 50
      highlightSyntax:
        hidePlaceholder: true
        telemetry: false
        option: lunr
  mainSections:
    - posts
  dateLayout:
    live:
    changed:
  templates:
    home:
    search:
    twitter_cards:
    opengraph:
    share:
    rss:
    single:

outputFormats:
  SearchIndex:
    mediaType: application/json
    baseName: search-index
    replaceExt: true
    isHTML: true

outputs:
  home: [HTML, SearchIndex, RSS, JSON]
  section: [HTML, RSS]

taxonomies:
  tag: tags
  category: categories

privacy:
  googleAnalytics:
  instagram:
  twitter:
  youtube:

services:
  instagram:
  twitter:

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    style: monokai

rss: 20
