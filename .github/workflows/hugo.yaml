# Build Hugo site and deploy to GitHub Pages + Tencent Cloud
#
# Trigger: push to main branch
# Environment: Ubuntu 24.04, Hugo 0.147.8 (extended)
# Targets:
#   1. GitHub Pages
#   2. COS (Object Storage) — via coscmd
#   3. CloudBase Static Website Hosting — via cloudbase-cli

name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.147.8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Fix invalid dates in front matter
        run: |
          find content/posts -name "index.md" -exec sed -i 's/date: 2024-20-25/date: 2024-12-25/g' {} +
          echo "=== Fixed invalid dates ==="

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          echo "=== Hugo version ==="
          hugo version
          echo "=== Building site ==="
          hugo \
            --gc \
            --minify \
            --baseURL "https://hengjian2026.github.io/HJianBlog/"
          echo "=== Build output ==="
          ls -la public/

      - name: Index with Pagefind
        run: npx pagefind --site public

      - name: Upload public/ as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy-pages:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cos:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: public

      - name: Install coscmd
        run: pip install coscmd

      - name: Configure coscmd
        run: |
          coscmd config \
            -a ${{ secrets.TENCENT_SECRET_ID }} \
            -s ${{ secrets.TENCENT_SECRET_KEY }} \
            -b ${{ secrets.TENCENT_BUCKET }} \
            -r ${{ secrets.TENCENT_REGION }}

      - name: Upload to COS
        continue-on-error: true
        timeout-minutes: 15
        run: |
          echo "=== Uploading to COS ==="
          coscmd upload -r ./public / --ignore "*.md"
          echo "=== Upload complete ==="

  deploy-cloudbase:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: public

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: Deploy to CloudBase Static Hosting
        timeout-minutes: 15
        env:
          CLOUDBASE_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          CLOUDBASE_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          echo "=== Deploying to CloudBase ==="
          cloudbase login --apiKeyId "$CLOUDBASE_SECRET_ID" --apiKey "$CLOUDBASE_SECRET_KEY"
          cloudbase hosting deploy ./public / -e hjian-blog-d6gy567xfbdddb2e8
          echo "=== CloudBase deploy complete ==="