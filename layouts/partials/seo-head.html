{{- /* 结构化数据 JSON-LD — 仅在文章页添加 Article Schema */}}
{{- if .IsPage }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": {{ .Title | jsonify }},
  "description": {{ .Description | default .Summary | plainify | jsonify }},
  "datePublished": {{ .Date.Format "2006-01-02T15:04:05Z" | jsonify }},
  "dateModified": {{ if .Lastmod }}{{ .Lastmod.Format "2006-01-02T15:04:05Z" | jsonify }}{{ else }}{{ .Date.Format "2006-01-02T15:04:05Z" | jsonify }}{{ end }},
  "author": {
    "@type": "Person",
    "name": {{ .Params.author | default site.Params.author | jsonify }}
  },
  "publisher": {
    "@type": "Organization",
    "name": {{ site.Title | jsonify }}
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": {{ .Permalink | jsonify }}
  }
}
</script>
{{- end }}
